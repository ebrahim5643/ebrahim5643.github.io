<!DOCTYPE html><html lang="bn"><head><title>ডেটা মোছার নিয়ম - আয় ব্যয়</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:"Noto Sans Bengali",system-ui,sans-serif;max-width:720px;margin:auto;padding:20px;line-height:1.8;color:#1b1b1f}h1{color:#1a6dff}h2{margin-top:28px}</style></head><body><h1>অ্যাকাউন্ট ও ডেটা মোছার নিয়ম</h1><ol><li>আয় ব্যয় অ্যাপ খুলুন এবং লগইন করা থাকুন।</li><li>⚙️ চাপুন।</li><li><b>অ্যাকাউন্ট ও ক্লাউড ডেটা মুছুন</b> বাটন দুইবার চাপুন।</li></ol><p>এতে ক্লাউডে ও ফোনে থাকা আপনার সব ডেটা মুছে যাবে এবং তা ফেরানো যাবে না। অ্যাপ ছাড়া মোছাতে চাইলে ইমেইল করুন: <b>sagor213424@gmail.com</b></p></body></html>
